name: HopTrace - build APK only

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: hoptrace-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify installable APK (no emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android 17 build toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root was not set by setup-android."
            exit 1
          fi

          # API 37 is currently installed by sdkmanager under android-37.0.
          # Keep the android-37 alias for tools that still look for that path.
          if [[ -d "$SDK_ROOT/platforms/android-37.0" && ! -e "$SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

          test -s "$SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          test -d "$SDK_ROOT/ndk/28.2.13676358"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK / NDK / CMake installation verified."

      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          VERSION='9.6.0'
          ZIP="$RUNNER_TEMP/gradle-${VERSION}-bin.zip"
          curl --fail --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            --output "$ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-${VERSION}/bin/gradle" --version

      - name: Locate project and validate source
        shell: bash
        run: |
          set -euo pipefail
          ROOTS=()
          while IFS= read -r -d '' settings_file; do
            candidate="$(dirname "$settings_file")"
            if [[ -f "$candidate/app/build.gradle" || -f "$candidate/app/build.gradle.kts" ]]; then
              ROOTS+=("$candidate")
            fi
          done < <(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' \
            -print0 | sort -z)

          if [[ ${#ROOTS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Android Gradle project; found ${#ROOTS[@]}."
            printf 'Detected project: %s\n' "${ROOTS[@]}"
            exit 1
          fi

          PROJECT_DIR="${ROOTS[0]}"
          APP="$PROJECT_DIR/app"
          MAIN="$APP/src/main/java/com/hoptrace/app/MainActivity.java"
          SETTINGS="$PROJECT_DIR/settings.gradle"

          required_files=(
            "$PROJECT_DIR/build.gradle"
            "$SETTINGS"
            "$APP/build.gradle"
            "$APP/src/main/AndroidManifest.xml"
            "$APP/src/main/cpp/CMakeLists.txt"
            "$APP/src/main/cpp/traceroute.cpp"
            "$APP/src/main/java/com/hoptrace/app/MainActivity.java"
            "$APP/src/main/java/com/hoptrace/app/NativeTraceroute.java"
            "$APP/src/main/java/com/hoptrace/app/GeoIpClient.java"
            "$APP/src/main/java/com/hoptrace/app/GeoInfo.java"
            "$APP/src/main/java/com/hoptrace/app/HopResult.java"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required project file is missing or empty: $file"
              exit 1
            fi
          done

          grep -Fq "applicationId 'com.hoptrace.app'" "$APP/build.gradle"
          grep -Fq 'compileSdk 37' "$APP/build.gradle"
          grep -Fq 'targetSdk 37' "$APP/build.gradle"
          grep -Fq "versionName '1.1.1'" "$APP/build.gradle"
          grep -Fq 'targetLayout.addView(targetInput, new LinearLayout.LayoutParams(' "$MAIN"
          grep -Fq 'layout.addView(input, new LinearLayout.LayoutParams(' "$MAIN"
          grep -Fq '@Override public void onLowMemory()' "$MAIN"
          ! grep -Fq 'targetLayout.addView(targetInput, new ViewGroup.LayoutParams(' "$MAIN"
          ! grep -Fq 'layout.addView(input, new ViewGroup.LayoutParams(' "$MAIN"
          ! grep -Fq '@Override protected void onLowMemory()' "$MAIN"

          # Ensure the Google-hosted Maven Central mirror is first in both
          # pluginManagement and dependencyResolutionManagement. This avoids
          # silently relying on only the Maven Central hostname that failed before.
          python3 - "$SETTINGS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'

          def ensure_mirror(text: str, start_marker: str, end_marker: str) -> str:
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Missing Gradle settings block: {start_marker}")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"Missing Gradle settings boundary: {end_marker}")
              block = text[start:end]
              if mirror not in block:
                  anchor = '        mavenCentral()'
                  if anchor not in block:
                      raise SystemExit(f"Cannot insert Maven mirror in {start_marker}")
                  block = block.replace(anchor, f'        {mirror}\n{anchor}', 1)
              return text[:start] + block + text[end:]

          text = ensure_mirror(text, 'pluginManagement {', 'dependencyResolutionManagement {')
          text = ensure_mirror(text, 'dependencyResolutionManagement {', 'rootProject.name')
          path.write_text(text, encoding='utf-8')
          if text.count('maven-central.storage-download.googleapis.com/maven2/') < 2:
              raise SystemExit('Maven Central mirror is not present in both repository blocks.')
          print('Gradle plugin and dependency repository mirror configuration verified.')
          PY

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "Detected Android project root: $PROJECT_DIR"
          echo "Source preflight passed. No emulator or device-test action will run."

      - name: Verify Kotlin Gradle plugin artifacts are reachable
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://maven-central.storage-download.googleapis.com/maven2'
          for path in \
            'org/jetbrains/kotlin/kotlin-gradle-plugin-api/2.2.10/kotlin-gradle-plugin-api-2.2.10.jar' \
            'org/jetbrains/kotlin/kotlin-gradle-plugin-idea/2.2.10/kotlin-gradle-plugin-idea-2.2.10.jar'; do
            output="$RUNNER_TEMP/$(basename "$path")"
            curl --fail --show-error --silent --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "$BASE/$path" --output "$output"
            test -s "$output"
            echo "Dependency reachable: $(basename "$output") ($(stat -c%s "$output") bytes)."
          done

      - name: Build debug APK (no emulator)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --refresh-dependencies \
            --project-dir "$PROJECT_DIR" \
            clean assembleDebug \
            --stacktrace --console=plain

      - name: Verify APK package, signature, alignment and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="$APK_PATH"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$APK" || { echo '::error::Gradle completed without producing app-debug.apk.'; exit 1; }

          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/hoptrace-badging.txt"

          grep -Fq "package: name='com.hoptrace.app'" "$RUNNER_TEMP/hoptrace-badging.txt"
          grep -Fq "sdkVersion:'26'" "$RUNNER_TEMP/hoptrace-badging.txt"
          grep -Fq "targetSdkVersion:'37'" "$RUNNER_TEMP/hoptrace-badging.txt"
          grep -Fq "versionName='1.1.1-debug'" "$RUNNER_TEMP/hoptrace-badging.txt"

          unzip -Z1 "$APK" > "$RUNNER_TEMP/hoptrace-apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -Fxq "lib/$abi/libhoptrace.so" "$RUNNER_TEMP/hoptrace-apk-files.txt" || {
              echo "::error::APK is missing lib/$abi/libhoptrace.so."
              exit 1
            }
          done

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          {
            echo '## HopTrace APK build result'
            echo
            echo '- Build: **successful**'
            echo '- Emulator/device tests: **not run (intentionally disabled)**'
            echo '- Package: `com.hoptrace.app`'
            echo '- Version: `1.1.1-debug`'
            echo '- minSdk: `26`'
            echo '- targetSdk: `37`'
            echo '- Native ABIs: `arm64-v8a`, `armeabi-v7a`, `x86_64`'
            echo "- SHA-256: \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"

      - name: Upload APK as a direct file (not a ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: HopTrace-1.1.1-debug.apk
          path: ${{ env.APK_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30
